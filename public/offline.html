<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c10510" />
    <title>Sem conexão · Sistema FCT</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fbf9f7;
        color: #161213;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      img { width: 96px; height: auto; }
      h1 { margin: 20px 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: #6e6265; font-size: 15px; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 10px;
        background: #161213;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 22px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1716; color: #f3f0ee; }
        p { color: #b5aaa8; }
        button { background: #f3f0ee; color: #161213; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/marca/fct-emblema.png" alt="Farmácias FCT" />
      <h1>Sem conexão com a internet</h1>
      <p>O Sistema FCT precisa de internet para abrir. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
